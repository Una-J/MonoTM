[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "monotm"
version = "0.1.0"
description = "Topic mixtures from sparse features, with validated semantic descriptors"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Una Joh"}, {name = "Bei Yu"}]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
embeddings = ["transformers==4.51.0", "sentencepiece>=0.2", "accelerate>=0.26,<2"]

[project.scripts]
monotm = "monotm.cli:main"

[project.urls]
Repository = "https://github.com/Una-J/MonoTM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monotm = ["prompts/*.txt"]
